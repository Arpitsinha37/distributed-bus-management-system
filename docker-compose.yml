services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
      POSTGRES_DB: bus_booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cms_user -d bus_booking']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend API (NestJS) ──────────────────────────────────
  backend:
    build:
      context: ./bus-booking-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: '3001'
      DATABASE_URL: 'postgresql://cms_user:cms_password@postgres:5432/bus_booking?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JWT_SECRET: 'super-secret-jwt-key-change-in-production'
      JWT_EXPIRES_IN: '8h'
      SEAT_HOLD_MINUTES: '8'
      ESEWA_MERCHANT_CODE: ''
      KHALTI_SECRET_KEY: ''
      STRIPE_SECRET_KEY: ''
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Storefront (Next.js) ─────────────────────────────────
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      NEXT_PUBLIC_API_URL: 'http://localhost:3001/api/v1'
      NEXT_PUBLIC_SITE_ID: 'pokhara-travels'
    depends_on:
      - backend

  # ─── Admin Panel (Next.js) ────────────────────────────────
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      NEXT_PUBLIC_API_URL: 'http://localhost:3001/api/v1'
    depends_on:
      - backend

volumes:
  pgdata:
