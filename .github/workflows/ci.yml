name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: bus-booking-backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: bus-booking-backend
        run: npx prisma generate

      - name: Build Backend
        working-directory: bus-booking-backend
        run: npx nest build

      - name: TypeScript Check
        working-directory: bus-booking-backend
        run: npx tsc --noEmit

  build-admin-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: admin-panel
        run: npm ci

      - name: Build Admin Panel
        working-directory: admin-panel
        run: npm run build

  build-storefronts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storefront: [storefront, storefront-chitwan, storefront-lumbini]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: ${{ matrix.storefront }}
        run: npm ci

      - name: Build ${{ matrix.storefront }}
        working-directory: ${{ matrix.storefront }}
        run: npm run build
